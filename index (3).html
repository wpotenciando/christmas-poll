<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Party Poll</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<style>
:root{box-sizing:border-box;--bg:#fbf6ef;--card:#ffffff;--text:#2a2320;--muted:#7a6d64;--red:#b3262e;--green:#1f6b45;--line:#eadfd2;--bar:#f1e4d6;--btn-text:#fff}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#16120f;--card:#221c18;--text:#f4ece4;--muted:#b0a296;--red:#e0555c;--green:#4fbf85;--line:#3a312b;--bar:#33291f;--btn-text:#16120f}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:2rem;margin:0 0 4px;color:var(--red)}
.sub{color:var(--muted);margin:0 0 12px;font-family:system-ui,sans-serif;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.opt{position:relative;overflow:hidden;cursor:pointer;display:block;width:100%;text-align:left;color:var(--text);font:inherit}
.opt.mine{border-color:var(--green);border-width:2px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--bar);width:0;transition:width .4s}
.opt.mine .fill{background:color-mix(in srgb,var(--green) 22%,transparent)}
.row{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px}
.label{font-size:1.1rem}
.count{font-family:system-ui,sans-serif;font-weight:700;white-space:nowrap}
.tick{color:var(--green);font-family:system-ui,sans-serif;font-size:.8rem;display:block}
.who{display:block;color:var(--muted);font-family:system-ui,sans-serif;font-size:.8rem;margin-top:2px}
.add{display:flex;flex-wrap:wrap;gap:8px;font-family:system-ui,sans-serif}
.add input{flex:1 1 160px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
button.primary{padding:10px 16px;border:0;border-radius:10px;background:var(--red);color:var(--btn-text);font-family:system-ui,sans-serif;font-size:1rem;font-weight:600;cursor:pointer}
button.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 4px;position:relative}
.msg{font-family:system-ui,sans-serif;color:var(--muted);font-size:.9rem;margin-top:8px}
.total{font-family:system-ui,sans-serif;color:var(--muted);font-size:.9rem;margin:16px 0 8px}
.hidden{display:none!important}
.gate{min-height:60vh;display:flex;align-items:center;justify-content:center}
.gate .card{width:100%;max-width:420px;text-align:center}
.gate .add{justify-content:center}
.linkbtn{background:none;border:0;padding:0;color:var(--red);font:inherit;cursor:pointer;text-decoration:underline}
.pics{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:28px}
.pic{width:170px;aspect-ratio:1/1;background-size:cover;background-position:center;border-radius:20px;pointer-events:none}

.pics{display:block;margin:0}
.pic{position:fixed;top:50%;width:300px;margin-top:-150px}
.pic-l{right:calc(50% + 320px + 32px)}
.pic-r{left:calc(50% + 320px + 32px)}

<body>
<main>
  <h1>🎄 Christmas Party Poll</h1>
  <div class="gate" id="gate">
    <div class="card">
      <strong>What’s your name?</strong>
      <div class="add" style="margin-top:10px">
        <input id="myName" type="text" maxlength="40" placeholder="Enter your name">
        <button class="primary" id="saveName">Continue</button>
      </div>
      <div class="msg" id="nameMsg"></div>
    </div>
  </div>
  <div id="app" class="hidden">
    <p class="sub">Tap the day that works for you. You can change your vote anytime.</p>
    <p class="msg" id="whoami" style="margin:0 0 16px"></p>
    <div id="list"></div>
    <div class="total" id="total"></div>
    <div class="card">
      <strong>Add a choice</strong>
      <div class="add" style="margin-top:10px">
        <input id="newOpt" type="text" maxlength="60" placeholder="e.g. Sat, Dec 20 – 6 PM">
        <button class="primary" id="addBtn">Add choice</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <div class="pics" aria-hidden="true"><div class="pic pic-l"></div><div class="pic pic-r"></div></div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnS4ZVGYYuXAwpwHghNpY_K1YcoHpgBKw",
  authDomain: "christmasparty-bf83b.firebaseapp.com",
  projectId: "christmasparty-bf83b",
  storageBucket: "christmasparty-bf83b.firebasestorage.app",
  messagingSenderId: "922907969901",
  appId: "1:922907969901:web:2231257a5cf43686b47264"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const listEl=$('list'), totalEl=$('total'), msgEl=$('msg'), input=$('newOpt'), nameInput=$('myName');
const isAdmin = new URLSearchParams(location.search).has('admin');
let uid=null, options=[], votes=[], myName='', editing=false;
try{ myName=(localStorage.getItem('xmasName')||'').trim(); }catch(e){}
nameInput.value=myName;

const setMsg = t => { msgEl.textContent = t||''; };

function showView(){
  const ok = !!myName && !editing;
  $('gate').classList.toggle('hidden', ok);
  $('app').classList.toggle('hidden', !ok);
}
function updateWho(){
  const w=$('whoami'); w.textContent='';
  if(myName){
    w.appendChild(document.createTextNode('Voting as '+myName+' · '));
    const b=document.createElement('button'); b.className='linkbtn'; b.textContent='Change name';
    b.onclick=()=>{ editing=true; nameInput.value=myName; showView(); nameInput.focus(); };
    w.appendChild(b);
  }
  showView();
}
updateWho();

$('saveName').onclick = async () => {
  const v=nameInput.value.trim();
  if(!v){ $('nameMsg').textContent='Please type your name.'; return; }
  myName=v; editing=false; $('nameMsg').textContent='';
  try{ localStorage.setItem('xmasName',v); }catch(e){}
  updateWho();
  const cur=votes.find(x=>x.id===uid);
  if(uid && cur){ try{ await setDoc(doc(db,'votes',uid),{optionId:cur.optionId,name:v}); }catch(e){} }
  render();
};
nameInput.addEventListener('keydown',e=>{ if(e.key==='Enter') $('saveName').click(); });

function render(){
  listEl.textContent='';
  if(!options.length){
    const e=document.createElement('div'); e.className='card msg';
    e.textContent='No choices yet. Add the first date below!'; listEl.appendChild(e);
  }
  const ids=new Set(options.map(o=>o.id));
  const counts={}, names={}; let mine=null, total=0;
  votes.forEach(v=>{
    if(!ids.has(v.optionId)) return;
    total++;
    counts[v.optionId]=(counts[v.optionId]||0)+1;
    (names[v.optionId]=names[v.optionId]||[]).push(v.name||'Someone');
    if(v.id===uid){
      mine=v.optionId;
      if(!myName && v.name){ myName=v.name; nameInput.value=v.name; updateWho(); }
    }
  });
  const max=Math.max(1,...Object.values(counts));
  options.forEach(o=>{
    const n=counts[o.id]||0;
    const b=document.createElement('div');
    b.className='card opt'+(mine===o.id?' mine':'');
    b.setAttribute('role','button'); b.tabIndex=0;
    const fill=document.createElement('div'); fill.className='fill'; fill.style.width=(n/max*100)+'%';
    const row=document.createElement('div'); row.className='row';
    const left=document.createElement('div');
    const l=document.createElement('span'); l.className='label'; l.textContent=o.label; left.appendChild(l);
    if(mine===o.id){ const t=document.createElement('span'); t.className='tick'; t.textContent='✓ Your vote'; left.appendChild(t); }
    if(names[o.id]){ const w=document.createElement('span'); w.className='who'; w.textContent=names[o.id].join(', '); left.appendChild(w); }
    const right=document.createElement('div');
    const c=document.createElement('span'); c.className='count'; c.textContent=n+(n===1?' vote':' votes'); right.appendChild(c);
    if(isAdmin){
      const x=document.createElement('button'); x.className='del'; x.title='Remove choice'; x.textContent='✕';
      x.onclick=ev=>{ ev.stopPropagation(); removeOpt(o.id); };
      right.appendChild(x);
    }
    row.appendChild(left); row.appendChild(right);
    b.appendChild(fill); b.appendChild(row);
    const go=()=>vote(o.id);
    b.onclick=go; b.onkeydown=ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); go(); } };
    listEl.appendChild(b);
  });
  totalEl.textContent=total+(total===1?' person has':' people have')+' voted';
}

async function vote(id){
  if(!uid){ setMsg('Still connecting… try again in a moment.'); return; }
  if(!myName){ setMsg('Please enter your name first.'); return; }
  try{ await setDoc(doc(db,'votes',uid),{optionId:id,name:myName}); setMsg(''); }
  catch(e){ setMsg('Couldn’t save your vote. Please try again.'); }
}
async function removeOpt(id){
  try{ await deleteDoc(doc(db,'options',id)); }catch(e){ setMsg('Couldn’t remove that choice.'); }
}
$('addBtn').onclick = async () => {
  const v=input.value.trim();
  if(!v){ setMsg('Type a date or time first.'); return; }
  if(!uid){ setMsg('Still connecting… try again in a moment.'); return; }
  try{ await addDoc(collection(db,'options'),{label:v,created:Date.now()}); input.value=''; setMsg(''); }
  catch(e){ setMsg('Couldn’t add that choice. Please try again.'); }
};
input.addEventListener('keydown',e=>{ if(e.key==='Enter') $('addBtn').click(); });

let started=false;
onAuthStateChanged(auth, user=>{
  if(!user){ signInAnonymously(auth).catch(()=>setMsg('Couldn’t connect. Check that Anonymous sign-in is on in Firebase.')); return; }
  uid=user.uid;
  if(started) return; started=true;
  onSnapshot(query(collection(db,'options'),orderBy('created','asc')),
    s=>{ options=s.docs.map(d=>({id:d.id,...d.data()})); render(); },
    ()=>setMsg('Couldn’t load choices. Check your Firestore rules.'));
  onSnapshot(collection(db,'votes'),
    s=>{ votes=s.docs.map(d=>({id:d.id,...d.data()})); render(); },
    ()=>{});
});
render();
</script>
</body>
</html>
